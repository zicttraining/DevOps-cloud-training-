name: ZiCloudTech Terraform CI/CD

on:
  push:
    branches:
      - "feature/**"
      - "develop"
      - "main"
    paths:
      - "modules/**"
      - "environments/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan, deploy, or destroy
        required: true
        default: dev
        type: choice
        options: [dev, uat, prod]
      action:
        description: Terraform action
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]

permissions:
  contents: read

jobs:
  feature-validation:
    name: Feature branch validation
    # Runs ONLY on pushes to feature branches
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Format Terraform files
        working-directory: .
        run: terraform fmt -recursive

      - name: Initialize without remote backend
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate

  deploy:
    name: ${{ github.event.inputs.action || 'deploy' }}-${{ github.event.inputs.environment || 'dev' }}
    # Runs on manual triggers OR automatically after merging/pushing into develop or main
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: terraform-${{ github.event.inputs.environment || 'dev' }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: environments/${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: zict-${{ github.event.inputs.environment || 'dev' }}-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Format Terraform files
        working-directory: .
        run: terraform fmt -recursive

      - name: Initialize remote backend
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Validate Terraform
        run: terraform validate

      - name: Create plan
        if: github.event.inputs.action != 'destroy'
        env:
          TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
        run: terraform plan -input=false -out=tfplan

      - name: Create destroy plan
        if: github.event.inputs.action == 'destroy'
        env:
          TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
        run: terraform plan -destroy -input=false -out=tfplan

      - name: Apply plan
        # Runs apply on manual trigger (apply/destroy) OR automatically on push to develop/main
        if: github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy' || github.event_name == 'push'
        env:
          TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
        run: terraform apply -input=false -auto-approve tfplan